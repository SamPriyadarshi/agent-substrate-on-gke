apiVersion: substrate.google.com/v1alpha1
kind: Atespace
metadata:
  name: demo-tenant
---
apiVersion: substrate.google.com/v1alpha1
kind: ActorTemplate
metadata:
  name: python-agent
  namespace: demo-tenant
spec:
  idleTimeout: "30s"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  template:
    spec:
      containers:
      - name: agent
        image: python:3.11-slim
        command: ["python3", "-u", "-c"]
        args:
        - |
          import http.server, socketserver, json, os, time
          history = []
          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('content-length', 0))
                  body = self.rfile.read(length).decode('utf-8')
                  try:
                      payload = json.loads(body)
                  except:
                      payload = {"raw": body}
                  history.append({"time": time.time(), "input": payload})
                  resp = {
                      "status": "ok",
                      "pid": os.getpid(),
                      "turn_count": len(history),
                      "history": history
                  }
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps(resp).encode('utf-8'))
          with socketserver.TCPServer(("", 8080), Handler) as httpd:
              httpd.serve_forever()
        ports:
        - containerPort: 8080
---
apiVersion: substrate.google.com/v1alpha1
kind: Actor
metadata:
  name: devops-agent-1
  namespace: demo-tenant
spec:
  templateRef:
    name: python-agent
