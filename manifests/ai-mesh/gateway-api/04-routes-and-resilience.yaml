# Pillar 5: Protocol-Aware Routing via Kubernetes Gateway API (HTTPRoute)
# Routes MCP requests to corresponding backend tool based on headers or path
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-currency-route
  namespace: mcp-tools
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: currency-tool
    port: 8080
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: currency-tool
      port: 8080
    timeouts:
      request: 30s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-database-route
  namespace: mcp-tools
spec:
  parentRefs:
